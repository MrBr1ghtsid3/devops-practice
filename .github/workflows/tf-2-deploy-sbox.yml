name: "Terraform — Deploy SBOX"

on:
  push:
    branches:
      - master
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-sbox:
    name: "deploy sbox"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/sbox

    env:
      ARM_USE_OIDC: "true"
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID_SBOX }}
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_SBOX }}
      TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID_SBOX }}
      TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID_SBOX }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID_SBOX }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: init
        run: terraform init

      - name: plan
        run: terraform plan -var-file=sbox.tfvars -out=tfplan

      - name: apply
        run: terraform apply tfplan
